name: CI

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    MIN_COVERAGE: 95
    # Public gist behind the README coverage badge.
    COVERAGE_GIST_ID: e88955814d3eda9b2eedfc08e26c5749

jobs:
    static-analysis:
        name: Format, lint, LWC tests, Code Analyzer
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Check branch name and PR title
              if: github.event_name == 'pull_request'
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BRANCH: ${{ github.head_ref }}
              run: node scripts/verify-commit-message.js --title "$PR_TITLE" --branch "$PR_BRANCH"
            - run: npm run prettier:verify
            - run: npm run lint
            - run: npm run test:unit:coverage
            - name: Install Salesforce CLI + Code Analyzer
              run: |
                  npm install --global @salesforce/cli
                  sf plugins install code-analyzer
            - name: Code Analyzer
              run: sf code-analyzer run --rule-selector Recommended --severity-threshold 2 --view table

    org-tests:
        name: Validate deploy + Apex tests (Dev Hub org)
        needs: static-analysis
        runs-on: ubuntu-latest
        # Fork PRs have no access to secrets: skip the org job for them.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # Every run validates against the same org: one at a time.
        concurrency:
            group: dev-hub-validation
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - run: npm install --global @salesforce/cli

            - name: Authenticate Dev Hub
              run: |
                  echo "${{ secrets.DEVHUB_SFDX_AUTH_URL }}" > ./authfile
                  sf org login sfdx-url --sfdx-url-file ./authfile --alias devhub --set-default-dev-hub
                  rm -f ./authfile

            # Check-only deploy: nothing is saved in the org. Only this project's test classes run, so the org's own
            # classes and tests do not affect the result.
            - name: Validate deploy and run Apex tests
              run: |
                  if [ -z "$(find force-app -type f ! -name '.gitkeep' | head -1)" ]; then
                    echo "No metadata in force-app: nothing to validate."
                    echo '{}' > validate.json
                    exit 0
                  fi
                  TESTS=$(find force-app -name '*Test.cls' -exec basename {} .cls \; | sort | tr '\n' ' ')
                  if [ -z "$TESTS" ]; then
                    echo "No Apex test classes: validating the deploy only."
                    TEST_ARGS="--test-level NoTestRun"
                  else
                    TEST_ARGS="--test-level RunSpecifiedTests --tests $TESTS"
                  fi
                  sf project deploy validate --source-dir force-app --target-org devhub $TEST_ARGS --wait 30 --json > validate.json \
                    || { jq '.message, (.result.details.componentFailures? // [] | if type == "array" then . else [.] end | .[] | {fullName, problem}), (.result.details.runTestResult.failures? // [] | if type == "array" then . else [.] end | .[] | {test: (.name + "." + .methodName), message, stackTrace})' validate.json; exit 1; }
                  jq '.result | {tests: .numberTestsTotal, testErrors: .numberTestErrors}' validate.json

            - name: Enforce coverage threshold
              id: coverage
              run: |
                  CLASSES=$(find force-app -name '*.cls' ! -name '*Test.cls' -exec basename {} .cls \; | jq -R . | jq -sc .)
                  COVERAGE=$(jq -r --argjson classes "$CLASSES" '
                    [.result.details.runTestResult.codeCoverage? // [] | if type == "array" then . else [.] end | .[]
                      | select(.name as $n | $classes | index($n))
                      | {total: (.numLocations | tonumber), missed: (.numLocationsNotCovered | tonumber)}]
                    | if (map(.total) | add // 0) == 0 then "N/A"
                      else ((map(.total - .missed) | add) * 100 / (map(.total) | add) | floor) end' validate.json)
                  echo "Coverage of this project's classes: ${COVERAGE}% (min ${MIN_COVERAGE}%)"
                  echo "percent=${COVERAGE}" >> "$GITHUB_OUTPUT"
                  if [[ "$COVERAGE" =~ ^[0-9]+$ ]] && [ "$COVERAGE" -lt "$MIN_COVERAGE" ]; then
                    echo "::error::Coverage ${COVERAGE}% is below ${MIN_COVERAGE}%"
                    exit 1
                  fi

            # The README coverage badge reads this gist through shields.io. Only main updates it.
            - name: Publish coverage badge
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
                  COVERAGE: ${{ steps.coverage.outputs.percent }}
              run: |
                  if [ -z "$GIST_TOKEN" ] || ! [[ "$COVERAGE" =~ ^[0-9]+$ ]]; then
                    echo "::warning::Coverage badge not updated (missing GIST_TOKEN or coverage)."
                    exit 0
                  fi
                  if [ "$COVERAGE" -ge 95 ]; then COLOR=brightgreen; elif [ "$COVERAGE" -ge 85 ]; then COLOR=yellow; else COLOR=red; fi
                  BADGE=$(jq -nc --arg m "${COVERAGE}%" --arg c "$COLOR" '{schemaVersion: 1, label: "apex coverage", message: $m, color: $c}')
                  jq -n --arg content "$BADGE" '{files: {"callwise-coverage.json": {content: $content}}}' \
                    | curl -sf -X PATCH -H "Authorization: Bearer $GIST_TOKEN" -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/gists/${COVERAGE_GIST_ID}" -d @- > /dev/null
                  echo "Coverage badge updated: ${COVERAGE}% (${COLOR})"
