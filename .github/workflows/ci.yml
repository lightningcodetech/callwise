name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_COVERAGE: 95

jobs:
  static-analysis:
    name: Format, lint, LWC tests, Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check branch name and PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node scripts/verify-commit-message.js --title "$PR_TITLE" --branch "$PR_BRANCH"
      - run: npm run prettier:verify
      - run: npm run lint
      - run: npm run test:unit:coverage
      - name: Install Salesforce CLI + Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer
      - name: Code Analyzer
        run: sf code-analyzer run --rule-selector Recommended --severity-threshold 2 --view table

  org-tests:
    name: Deploy + Apex tests (scratch org)
    needs: static-analysis
    runs-on: ubuntu-latest
    # Fork PRs have no access to secrets: skip the org job for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global @salesforce/cli

      - name: Authenticate Dev Hub
        run: |
          echo "${{ secrets.DEVHUB_SFDX_AUTH_URL }}" > ./authfile
          sf org login sfdx-url --sfdx-url-file ./authfile --alias devhub --set-default-dev-hub
          rm -f ./authfile

      - name: Create scratch org
        run: sf org create scratch --definition-file config/project-scratch-def.json --alias ci --set-default --duration-days 1 --wait 15

      - name: Deploy source
        run: sf project deploy start --target-org ci --wait 30

      - name: Run Apex tests
        run: |
          sf apex run test --target-org ci --test-level RunLocalTests --code-coverage --wait 30 --json > test-result.json \
            || { jq '.result.tests[]? | select(.Outcome != "Pass") | {MethodName: .FullName, Message: .Message, StackTrace: .StackTrace}' test-result.json; exit 1; }
          jq '.result.summary' test-result.json

      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(jq -r '.result.summary.testRunCoverage // "N/A"' test-result.json | tr -d '%')
          echo "Test run coverage: ${COVERAGE}% (min ${MIN_COVERAGE}%)"
          if [[ "$COVERAGE" =~ ^[0-9]+$ ]] && [ "$COVERAGE" -lt "$MIN_COVERAGE" ]; then
            echo "::error::Coverage ${COVERAGE}% is below ${MIN_COVERAGE}%"
            exit 1
          fi

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci --no-prompt || true
